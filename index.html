<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Horario 3B</title>
  <style>
    /* Estilos base */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #ffffff; /* Blanco puro */
      color: #000000; /* Negro puro */
      overflow-x: hidden;
    }

    /* Contenedor principal */
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
    }

    /* Header y botón de menú */
    .header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }
    .menu-btn {
      width: 30px;
      height: 30px;
      border: 1px solid #000;
      border-radius: 50%;
      background: transparent;
      color: #000;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s ease;
    }
    .menu-btn:hover {
      transform: scale(1.1);
    }

    /* Cartel del día actual */
    .current-day-message {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 20px;
      color: #000;
    }

    /* Menú lateral */
    .menu {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 180px;
      padding: 10px;
      background: #ffffff;
      border: 1px solid #000;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1000;
    }
    .menu.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }
    .menu-item {
      padding: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .menu-item:hover {
      background: #f0f0f0;
    }

    /* Grilla de horarios */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    /* Columnas de día */
    .day-column {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      transition: opacity 0.4s ease, transform 0.4s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: slideIn 0.4s forwards;
    }
    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .day-column h3 {
      margin: 0 0 15px 0;
      font-size: 1.1rem;
      font-weight: normal;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 8px;
    }

    /* Items de clase */
    .class-item {
      padding: 10px 0;
      font-size: 0.9rem;
      border-bottom: 1px solid #f0f0f0;
      transition: transform 0.2s ease;
    }
    .class-item:last-child {
      border-bottom: none;
    }
    .class-item:hover {
      transform: translateX(5px);
    }
    .current-module {
      border: 1px solid #000;
      border-radius: 4px;
      padding: 9px;
      position: relative;
    }
    .current-module::after {
      content: "Ahora";
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.7rem;
      color: #000;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .schedule-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="menu-btn" id="menuBtn">☰</button>
    </div>
    <div id="currentDayMessage" class="current-day-message"></div>
    <div class="schedule-grid" id="schedule"></div>

    <nav class="menu" id="menu">
      <div class="menu-item" data-day="all">Todos</div>
      <div class="menu-item" data-day="lunes">Lunes</div>
      <div class="menu-item" data-day="martes">Martes</div>
      <div class="menu-item" data-day="miercoles">Miércoles</div>
      <div class="menu-item" data-day="jueves">Jueves</div>
      <div class="menu-item" data-day="viernes">Viernes</div>
    </nav>
  </div>

  <script>
    /* Hora actual en Argentina */
    const argentinaTime = new Date().toLocaleString("en-US", { timeZone: "America/Argentina/Buenos_Aires" });
    const currentMinutes = new Date(argentinaTime).getHours() * 60 + new Date(argentinaTime).getMinutes();

    const modules = [
      { start: 1210, end: 1240 }, // 20:10 - 20:40
      { start: 1240, end: 1270 }, // 20:40 - 21:10
      { start: 1280, end: 1310 }, // 21:20 - 21:50
      { start: 1310, end: 1340 }, // 21:50 - 22:20
      { start: 1340, end: 1370 }, // 22:20 - 22:50
      { start: 1370, end: 1400 }  // 22:50 - 23:20
    ];
    let currentModuleIndex = -1;
    modules.forEach((mod, idx) => {
      if (currentMinutes >= mod.start && currentMinutes < mod.end) {
        currentModuleIndex = idx;
      }
    });

    const daysMap = {
      0: "domingo",
      1: "lunes",
      2: "martes",
      3: "miercoles",
      4: "jueves",
      5: "viernes",
      6: "sabado"
    };
    const currentDay = daysMap[new Date(argentinaTime).getDay()];
    document.getElementById("currentDayMessage").textContent = `Hoy es ${currentDay.charAt(0).toUpperCase() + currentDay.slice(1)}`;

    /* Datos del horario */
    const scheduleData = {
      lunes: [
        { subject: 'Sistemas de Información Contable', teacher: 'Pereira C.' },
        { subject: 'Sistemas de Información Contable', teacher: 'Pereira C.' },
        { subject: 'Psicología', teacher: 'Martorel (Supl.)' },
        { subject: 'Psicología', teacher: 'Martorel (Supl.)' },
        { subject: 'Lengua y Literatura', teacher: 'Arrieta' },
        { subject: 'Lengua y Literatura', teacher: 'Arrieta' }
      ],
      martes: [
        { subject: 'Matemática', teacher: 'Cerrato (Supl. Ferreyra)' },
        { subject: 'Matemática', teacher: 'Cerrato (Supl. Ferreyra)' },
        { subject: 'Matemática', teacher: 'Cerrato (Supl. Ferreyra)' },
        { subject: 'Derecho Comercial', teacher: 'Otero' },
        { subject: 'Derecho Comercial', teacher: 'Otero' },
        { subject: 'Derecho Comercial', teacher: 'Otero' }
      ],
      miercoles: [
        { subject: 'Macro', teacher: 'Otero' },
        { subject: 'Macro', teacher: 'Otero' },
        { subject: 'Lengua y Literatura', teacher: 'Arrieta' },
        { subject: 'Lengua y Literatura', teacher: 'Arrieta' },
        { subject: 'Matemática', teacher: 'Cerrato (Supl. Ferreyra)' },
        { subject: 'Historia', teacher: 'Acosta' }
      ],
      jueves: [
        { subject: 'Legislación Laboral y Práctica', teacher: 'Pereira C.' },
        { subject: 'Legislación Laboral y Práctica', teacher: 'Pereira C.' },
        { subject: 'Sistemas de Información Contable', teacher: 'Pereira C.' },
        { subject: 'Sistemas de Información Contable', teacher: 'Pereira C.' },
        { subject: 'Técnica de la Información', teacher: 'Sánchez (Supl. Bidondo)' },
        { subject: 'Inglés', teacher: 'Taffarel' }
      ],
      viernes: [
        { subject: 'TGO II', teacher: 'Camera' },
        { subject: 'TGO II', teacher: 'Camera' },
        { subject: 'Tutoría', teacher: 'Atum' },
        { subject: 'Geografía', teacher: 'Siri' },
        { subject: 'Inglés', teacher: 'Taffarel' },
        { subject: 'Inglés', teacher: 'Taffarel' }
      ]
    };

    /* Elementos del DOM */
    const scheduleGrid = document.getElementById('schedule');
    const menuBtn = document.getElementById('menuBtn');
    const menu = document.getElementById('menu');
    const menuItems = document.querySelectorAll('.menu-item');
    let currentFilter = 'all';

    /* Generar columnas */
    function generateColumns(filter = 'all') {
      scheduleGrid.innerHTML = '';
      Object.entries(scheduleData).forEach(([day, classes]) => {
        if (filter !== 'all' && day !== filter) return;

        const column = document.createElement('div');
        column.className = 'day-column';
        column.dataset.day = day;

        const title = document.createElement('h3');
        title.textContent = day.charAt(0).toUpperCase() + day.slice(1);
        column.appendChild(title);

        classes.forEach((cls, index) => {
          const classItem = document.createElement('div');
          classItem.className = 'class-item';
          if (day === currentDay && index === currentModuleIndex) {
            classItem.classList.add('current-module');
          }
          classItem.textContent = `${index + 1}. ${cls.subject} (${cls.teacher})`;
          column.appendChild(classItem);
        });

        scheduleGrid.appendChild(column);
      });
    }
    generateColumns();

    /* Mostrar/ocultar menú */
    function toggleMenu(open) {
      menu.classList.toggle('active', open);
    }
    menuBtn.addEventListener('click', () => toggleMenu(true));
    menu.addEventListener('mouseleave', () => toggleMenu(false));

    menuItems.forEach(item => {
      item.addEventListener('click', () => {
        currentFilter = item.dataset.day;
        generateColumns(currentFilter);
        toggleMenu(false);
      });
    });
  </script>
</body>
</html>
